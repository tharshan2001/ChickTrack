# Production profile: SPRING_PROFILES_ACTIVE=prod (deploy/docker-compose.prod.yml sets it).
# Every secret below has no default: the app refuses to start until it is provided.

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# OAuth2: public HTTPS issuer, owner seed password, persistent signing key
app.oauth.issuer=${OAUTH_ISSUER}
app.oauth.admin.password=${OAUTH_ADMIN_PASSWORD}
app.oauth.jwk.private-key=${OAUTH_JWK_PRIVATE_KEY}
app.oauth.jwk.allow-generated=false

# Behind the nginx reverse proxy: trust X-Forwarded-* so redirects and the login page use https.
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-stacktrace=never

# Actuator: health only, no details
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.info.env.enabled=false

# No public API explorer in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Sentry: errors are reported only when SENTRY_DSN is set
sentry.dsn=${SENTRY_DSN:}
sentry.environment=production
