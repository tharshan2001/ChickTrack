spring.application.name=chicktrack

server.port=${SERVER_PORT:8090}

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chicktrack}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chicktrack}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:chicktrack}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# OAuth2 authorization server
app.oauth.issuer=${OAUTH_ISSUER:http://localhost:8090}
app.oauth.admin.username=${OAUTH_ADMIN_USERNAME:admin}
app.oauth.admin.password=${OAUTH_ADMIN_PASSWORD:change-me}
app.oauth.client.mobile.id=${OAUTH_MOBILE_CLIENT_ID:chicktrack-mobile}
app.oauth.client.mobile.redirect-uri=${OAUTH_MOBILE_REDIRECT_URI:chicktrack://oauth2/callback}

# JWT signing key: PKCS#8 PEM, e.g. file:/run/secrets/chicktrack-jwk.pem
# Generate: openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out jwk.pem
app.oauth.jwk.private-key=${OAUTH_JWK_PRIVATE_KEY:}
app.oauth.jwk.key-id=${OAUTH_JWK_KEY_ID:}
app.oauth.jwk.allow-generated=${OAUTH_JWK_ALLOW_GENERATED:true}
